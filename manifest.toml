#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "woodpecker"
name = "Woodpecker"
description.en = "CI engine with great extensibility integrated with GitHub, GitLab, Gitea..."
description.fr = "Outil d'intégration continue extensible intégrable avec GitHub, GitLab, Gitea..."

version = "3.20.1~ynh1"

maintainers = [ "Salamandar" ]

[upstream]
license = "Apache-2.0"
website = "https://woodpecker-ci.org"
admindoc = "https://woodpecker-ci.org/docs/administration"
userdoc = "https://woodpecker-ci.org/docs/intro"
code = "https://github.com/woodpecker-ci/woodpecker"
cpe = "cpe:2.3:a:woodpecker-ci:woodpecker"
fund = "https://opencollective.com/woodpecker-ci"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = [ "amd64", "arm64" ]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "0M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/woodpecker"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.forge_type]
    ask.en = "Select the kind of forge you're connecting Woodpecker to"
    ask.fr = "Sélectionnez le type de forge à laquelle vous connectez Woodpecker"
    type = "select"
    choices.github = "Github"
    choices.gitlab = "Gitlab"
    choices.gitea = "Gitea / Forgejo"
    choices.bitbucket = "Bitbucket"
    default = "github"

    [install.forge_url]
    ask.en = "Provide the forge URL"
    ask.fr = "Entrez l'URL de la forge"
    type = "string"
    default = "https://myforge.tld"
    help.en = "Useless for Bitbucket and Github.com."
    help.fr = "Inutile pour Bitbucket et Github.com."

    [install.forge_client]
    ask.en = "Provide the forge OAuth Client ID"
    ask.fr = "Entrez l'ID de client OAuth de la forge"
    type = "string"
    default = ""

    [install.forge_secret]
    ask.en = "Provide the forge OAuth secret"
    ask.fr = "Entrez le secret OAuth de la forge"
    type = "string"
    default = ""

    [install.admin]
    type = "user"

[resources]
    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v3.20.1/woodpecker-server_linux_amd64.tar.gz"
    amd64.sha256 = "82dd50755bb198943521fa30e788ddd20de8179126d5abf9cb5de43e506e45a2"

    arm64.url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v3.20.1/woodpecker-server_linux_arm64.tar.gz"
    arm64.sha256 = "e9cab800c637a0d690f0475a21a7961f4f91dc7cdd845babf7238c2ef71bfcdf"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "woodpecker-server_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "woodpecker-server_linux_arm64.tar.gz"

    in_subdir = false

    [resources.sources.agent]
    amd64.url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v3.20.1/woodpecker-agent_linux_amd64.tar.gz"
    amd64.sha256 = "cb8cf9028cde5a8eaf8612e9aec59a3e8636c1b2ab8d339cfafb770ebba5e3d8"

    arm64.url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v3.20.1/woodpecker-agent_linux_arm64.tar.gz"
    arm64.sha256 = "ac62b815257cb6b90f487366607bc918eb99221082a695fc39135496d4c49b28"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "woodpecker-agent_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "woodpecker-agent_linux_arm64.tar.gz"

    in_subdir = false

    [resources.system_user]
    
    [resources.install_dir]
    
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    
    main.default = 8000
    grpc.default = 9000
    healthcheck.default = 3002
    
    [resources.apt]
    packages = [ "git", "git-lfs", "postgresql" ]

    [resources.database]
    type = "postgresql"
